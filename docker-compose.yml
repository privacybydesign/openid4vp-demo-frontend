services:
  custom_verifier_frontend:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      # --- Public config (inlined into the client bundle at build time) -------
      - API_URL=https://verifierapi.openid4vc.staging.yivi.app
      - IRMA_SERVER_URL=https://is.demo.staging.yivi.app
      - UNIVERSAL_LINK_HOST=open.yivi.app
      - UNIVERSAL_LINK_HOST_STAGING=open.staging.yivi.app
      # --- Server-only config (used by the BFF proxy, never sent to browser) --
      - VERAMO_API_URL=https://veramo-verifier.openid4vc.staging.yivi.app
      - VERAMO_VERIFIER_NAME=test-verifier
      - VERAMO_ISSUER_API_URL=https://veramo-issuer.openid4vc.staging.yivi.app
      - VERAMO_ISSUER_NAME=test-issuer
      - VERAMO_AUTHCODE_ISSUER_NAME=authcode-issuer
      - EUDI_ISSUER_API_URL=https://eudi-issuer.openid4vc.staging.yivi.app
      # --- Admin tokens (server-only; REQUIRED) -------------------------------
      - VERAMO_ADMIN_TOKEN=${VERAMO_ADMIN_TOKEN:?VERAMO_ADMIN_TOKEN must be set (see .env.example)}
      - VERAMO_ISSUER_ADMIN_TOKEN=${VERAMO_ISSUER_ADMIN_TOKEN:?VERAMO_ISSUER_ADMIN_TOKEN must be set (see .env.example)}
