# Delivery: builds, scans and pushes ghcr.io/privacybydesign/openid4vp-demo-frontend.
# Push to main -> :edge, release vX.Y.Z -> :X.Y.Z and :latest, manual run ->
# :<branch>. PR builds are scanned in Status checks; published images are
# re-scanned weekly by image-rescan.yml.
name: Delivery

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  docker:
    uses: privacybydesign/github-workflows/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      # The old Delivery would tag :latest on a version release (metadata-action's
      # latest=auto with type=semver); keep doing so.
      tag-latest: true
      # Per-run cache buster for the apk/npm upgrade layers (see Dockerfile), as
      # the old Delivery passed, so every build picks up today's security fixes.
      build-args: SECURITY_UPGRADE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
