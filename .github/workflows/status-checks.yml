# Status checks, using the shared workflows from privacybydesign/github-workflows.
# The gate job "Status checks passed" is the one check to require.
name: Status checks

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  node:
    uses: privacybydesign/github-workflows/.github/workflows/node-checks.yml@v1
    permissions:
      contents: read
    with:
      node-version: "22" # same major as node:22-alpine in the Dockerfile
      scripts: lint build # eslint, tsc -b + vite build (there is no test script)
      ignore-scripts: true

  # Builds and scans the image without pushing it; Delivery pushes from main.
  docker:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    uses: privacybydesign/github-workflows/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      push-image: false
      # Per-run cache buster for the apk/npm upgrade layers (see Dockerfile), so
      # the scan sees today's upstream packages instead of a cached layer.
      build-args: SECURITY_UPGRADE_BUST=${{ github.run_id }}-${{ github.run_attempt }}

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: privacybydesign/github-workflows/.github/workflows/dependency-review.yml@v1
    permissions:
      contents: read
      pull-requests: write

  workflow-lint:
    uses: privacybydesign/github-workflows/.github/workflows/workflow-lint.yml@v1
    permissions:
      contents: read

  passed:
    name: Status checks passed
    if: always()
    needs: [node, docker, dependency-review, workflow-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if grep -qE '"(failure|cancelled)"' <<< "$RESULTS"; then exit 1; fi
