<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d9a8"/><stop offset="1" stop-color="#e8b878"/>
    </linearGradient>
    <clipPath id="frame"><rect width="300" height="400"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="300" height="400" fill="url(#bg)"/>
    <!-- shoulders -->
    <path d="M150 268 C 88 268 44 312 36 400 L 264 400 C 256 312 212 268 150 268 Z" fill="#1f7a72"/>
    <path d="M150 268 L 132 300 L 150 330 L 168 300 Z" fill="#12554f"/>
    <!-- neck -->
    <path d="M124 232 h52 v44 c0 12 -52 12 -52 0 Z" fill="#d9a072"/>
    <!-- head -->
    <ellipse cx="150" cy="168" rx="72" ry="86" fill="#eab892"/>
    <!-- ears -->
    <ellipse cx="78" cy="176" rx="11" ry="17" fill="#e0aa82"/>
    <ellipse cx="222" cy="176" rx="11" ry="17" fill="#e0aa82"/>
    <!-- hair: short, dark -->
    <path d="M150 74 C 96 74 74 116 78 158 C 84 132 96 120 116 116 C 140 112 176 110 200 122 C 214 129 220 142 222 158 C 228 114 204 74 150 74 Z" fill="#33251c"/>
    <!-- brows -->
    <rect x="110" y="150" width="34" height="8" rx="4" fill="#33251c"/>
    <rect x="156" y="150" width="34" height="8" rx="4" fill="#33251c"/>
    <!-- eyes -->
    <ellipse cx="127" cy="172" rx="10" ry="7" fill="#fff"/>
    <ellipse cx="173" cy="172" rx="10" ry="7" fill="#fff"/>
    <circle cx="127" cy="172" r="4.5" fill="#3b2b20"/>
    <circle cx="173" cy="172" r="4.5" fill="#3b2b20"/>
    <!-- nose + mouth -->
    <path d="M150 180 v20 q0 8 9 8" fill="none" stroke="#c98f63" stroke-width="5" stroke-linecap="round"/>
    <path d="M132 220 q18 12 36 0" fill="none" stroke="#a8553f" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
