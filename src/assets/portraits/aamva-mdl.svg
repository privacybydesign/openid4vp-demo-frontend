    <rect x="156" y="150" width="32" height="7" rx="3.5" fill="#5e2d16"/>
    <!-- eyes -->
    <ellipse cx="128" cy="174" rx="9" ry="6.5" fill="#fff"/>
    <ellipse cx="172" cy="174" rx="9" ry="6.5" fill="#fff"/>
    <circle cx="128" cy="174" r="4" fill="#2f4a3a"/>
    <circle cx="172" cy="174" r="4" fill="#2f4a3a"/>
    <!-- glasses -->
    <g fill="none" stroke="#2b2b2b" stroke-width="5">
      <rect x="107" y="160" width="42" height="30" rx="10"/>
      <rect x="151" y="160" width="42" height="30" rx="10"/>
      <path d="M149 172 h4"/><path d="M107 170 L 84 166"/><path d="M193 170 L 216 166"/>
    </g>
    <path d="M150 182 v20 q0 8 9 8" fill="none" stroke="#b87f5c" stroke-width="5" stroke-linecap="round"/>
    <path d="M133 222 q17 11 34 0" fill="none" stroke="#9d4a4a" stroke-width="6" stroke-linecap="round"/>
