    <path d="M150 272 C 90 272 46 314 38 400 L 262 400 C 254 314 210 272 150 272 Z" fill="#26364f"/>
    <path d="M150 272 L 134 302 L 150 332 L 166 302 Z" fill="#17233a"/>
