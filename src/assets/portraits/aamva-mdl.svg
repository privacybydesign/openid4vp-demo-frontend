    <path d="M126 234 h48 v44 c0 12 -48 12 -48 0 Z" fill="#c98f6e"/>
    <!-- head -->
    <ellipse cx="150" cy="170" rx="70" ry="84" fill="#dda886"/>
    <ellipse cx="80" cy="178" rx="10" ry="16" fill="#d29c7c"/>
    <ellipse cx="220" cy="178" rx="10" ry="16" fill="#d29c7c"/>
    <!-- fringe -->
    <path d="M150 80 C 100 80 80 118 82 156 C 96 128 120 118 150 118 C 180 118 204 128 218 156 C 220 118 200 80 150 80 Z" fill="#8d4522"/>
